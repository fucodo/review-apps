# Example per-MR stack – lives in the application repository.
# Deployed by GitLab CI with: docker compose -p review-mr-<iid> -f docker-compose.review.yml up -d
# Expected variables (from CI): IMAGE, STACK, REVIEW_HOST, ADMIN_PASSWORD
services:
  app:
    image: ${IMAGE}
    restart: unless-stopped
    environment:
      FLOW_CONTEXT: Production/Review
      BASE_URI: https://${REVIEW_HOST}/
      DB_HOST: db
      DB_NAME: flow
      DB_USER: flow
      DB_PASSWORD: flow
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - persistent:/app/Data/Persistent
    depends_on: [db]
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.http.routers.${STACK}.rule: Host(`${REVIEW_HOST}`)
      traefik.http.routers.${STACK}.entrypoints: websecure
      traefik.http.routers.${STACK}.middlewares: review-auth@file
      traefik.http.routers.${STACK}.service: ${STACK}
      traefik.http.services.${STACK}.loadbalancer.server.port: "80"
      # Dashboard metadata
      review.mr: "${CI_MERGE_REQUEST_IID}"
      review.role: app
      review.title: "${CI_MERGE_REQUEST_TITLE}"
      review.branch: "${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
      review.commit: "${CI_COMMIT_SHORT_SHA}"
      review.author: "${GITLAB_USER_NAME}"
      review.url: "https://${REVIEW_HOST}/"
      review.mr_url: "${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}"
      review.deployed_at: "${CI_JOB_STARTED_AT}"

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: flow
      MARIADB_USER: flow
      MARIADB_PASSWORD: flow
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [db:/var/lib/mysql]
    labels:
      review.mr: "${CI_MERGE_REQUEST_IID}"
      review.role: service
      review.service.name: DB
      review.service.order: "90"

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_WEBROOT: /_mail
    networks: [default, traefik]
    labels:
      traefik.enable: "true"
      traefik.http.routers.${STACK}-mail.rule: Host(`${REVIEW_HOST}`) && PathPrefix(`/_mail`)
      traefik.http.routers.${STACK}-mail.entrypoints: websecure
      traefik.http.routers.${STACK}-mail.middlewares: review-auth@file
      traefik.http.services.${STACK}-mail.loadbalancer.server.port: "8025"
      review.mr: "${CI_MERGE_REQUEST_IID}"
      review.role: service
      review.service.name: Mail
      review.service.url: "https://${REVIEW_HOST}/_mail/"
      review.service.order: "10"

volumes:
  persistent:
  db:

networks:
  traefik:
    external: true
